name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - run: npm run evidence
      - run: npm pack
      - name: Publish to npm (skipped when the NPM_TOKEN secret is absent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping npm publish"; else npm publish --provenance --access public; fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes protocolsutra-*.tgz documents/protocolsutra/evidence/evidence.md documents/protocolsutra/evidence/evidence.json || gh release upload "$GITHUB_REF_NAME" protocolsutra-*.tgz --clobber
