name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - run: npm run evidence
      - run: npm pack
      - name: Publish to npm (trusted publishing via OIDC, no token)
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${GITHUB_REF_TYPE}" = "tag" ] || { echo "not a tag run; skipping GitHub release"; exit 0; }
          gh release create "$GITHUB_REF_NAME" --generate-notes protocolsutra-*.tgz documents/protocolsutra/evidence/evidence.md documents/protocolsutra/evidence/evidence.json || gh release upload "$GITHUB_REF_NAME" protocolsutra-*.tgz --clobber
