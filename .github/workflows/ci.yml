name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - run: npm run doctor
      - run: npm run demo
      - name: Sample reports must be deterministic
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- examples/
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack --dry-run
      - name: Smoke test packed CLI
        run: |
          npm pack --silent
          mkdir smoke && cd smoke && npm init -y > /dev/null
          npm install ../protocolsutra-*.tgz
          npx protocolsutra --version
          npx protocolsutra fixture create --kind mcp --out s.json
          npx protocolsutra validate --input s.json --strict
