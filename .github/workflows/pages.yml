name: Pages
on:
  push:
    branches: [main]
    paths: ['documents/**', 'examples/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/build-docs.mjs
      - name: Assemble site
        run: |
          mkdir -p _site/examples
          cp -r documents/protocolsutra/. _site/
          cp examples/reports/*.html examples/reports/*.json examples/reports/*.md _site/examples/
          find _site -name '*.md' -path '_site/[0-9]*' -delete
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
